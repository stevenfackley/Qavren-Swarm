version: 2
updates:
  # .NET packages (app + test project)
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/tests"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python SDKs used by the agent images
  - package-ecosystem: "pip"
    directory: "/Agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the CI workflow (also keeps runner Node versions current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Added by the project-wide Dependabot sweep ──────────────────────────
  # Ecosystems present in the repo that no existing entry covered.
  - package-ecosystem: "docker"
    directory: "/Agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
