name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The app build and both test suites are pure — no Docker daemon required in CI.
      - name: Build (app)
        run: dotnet build QavrenSwarm.csproj -c Release

      - name: .NET contract tests (xUnit)
        run: dotnet test tests/QavrenSwarm.Tests.csproj -c Release

      - name: Agent tests (pytest)
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_agent.py -q
